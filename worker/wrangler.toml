# Optional — only needed if you deploy with the Wrangler CLI instead of the Cloudflare dashboard.
name = "bida-pay"
main = "bida-pay-worker.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "bidavibe"
APP_URL = "https://bida.vows-and-petals.com/"
ALLOWED_ORIGINS = "https://bida.vows-and-petals.com,https://campingchairph.github.io,http://localhost:8102"
PRICE_MONTH_CENTAVOS = "4900"    # ₱49.00 for 30 days
PRICE_LIFE_CENTAVOS = "14900"    # ₱149.00 lifetime

[[kv_namespaces]]
binding = "PREMIUM"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never put these in this file):
#   npx wrangler secret put PAYMONGO_SECRET_KEY
#   npx wrangler secret put PAYMONGO_WEBHOOK_SECRET
