# Optional — only needed if you deploy with the Wrangler CLI instead of the Cloudflare dashboard.
name = "bida-pay"
main = "bida-pay-worker.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "bidavibe"
APP_URL = "https://campingchairph.github.io/bida-vibe/"
ALLOWED_ORIGINS = "https://campingchairph.github.io,http://localhost:8102"
PRICE_CENTAVOS = "5000"
PASS_DAYS = "30"

[[kv_namespaces]]
binding = "PREMIUM"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never put these in this file):
#   npx wrangler secret put PAYMONGO_SECRET_KEY
#   npx wrangler secret put PAYMONGO_WEBHOOK_SECRET
