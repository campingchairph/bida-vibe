<title>Bida-Vibe Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 8h56l-6 24-22 24L10 32z' fill='%23E2367A' stroke='%231E1A16' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='24' r='7' fill='%23FFF6E5'/%3E%3C/svg%3E">

<style>
  :root { --rs-h: calc(150px + env(safe-area-inset-bottom)); }
  body { background: var(--cream); min-height: 100vh; padding-bottom: calc(var(--rs-h) + 74px); }
  .rm { max-width: 560px; margin: 0 auto; padding: 12px 14px 20px; }
  .rh { display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto; padding: 12px 14px 0; }
  .rh small { display: block; font: 800 11px/1 var(--f); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .rh b { display: block; font: 800 19px/1.15 var(--f2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rh > div { flex: 1; min-width: 0; }
  .rm-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--leaf); flex: none; box-shadow: 0 0 0 3px rgba(62,155,79,.3); }

  /* Home: category pads */
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; padding: 4px 2px 8px; }
  .cp { position: relative; height: 78px; border: 3px solid var(--ink); border-radius: 20px; color: #fff; font: 800 21px/1 var(--f2); letter-spacing: .01em;
    box-shadow: 0 6px 0 var(--ink); cursor: pointer; transition: transform .06s, box-shadow .06s; -webkit-tap-highlight-color: transparent; }
  .cp::after { content: ''; position: absolute; left: 10px; right: 10px; top: 7px; height: 9px; border-radius: 9px; background: rgba(255,255,255,.3); pointer-events: none; }
  .cp:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .cp.dark { color: var(--ink); }
  .cp .tvb { position: absolute; right: 8px; bottom: 7px; font: 800 10px/1 var(--f); letter-spacing: .08em; background: var(--ink); color: var(--gold); padding: 4px 6px; border-radius: 99px; }

  /* Inside pages: the app's usual look */
  .rp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .rp-head h2 { font: 800 24px/1.1 var(--f2); flex: 1; min-width: 0; }
  .rp-back { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; font: 800 22px/1 var(--f); }
  .rp-tv { flex: none; font: 800 11px/1 var(--f); padding: 6px 10px; border-radius: 99px; background: var(--turq-soft); border: 2px solid var(--ink); }
  .rp-sec { margin-top: 14px; }
  .rp-sec > h3, .rp-lbl { display: block; font: 800 13px/1.2 var(--f); color: var(--ink-3); margin: 0 0 8px; letter-spacing: .02em; }
  .rp-go { width: 100%; min-height: 76px; margin-top: 16px; border: 3px solid var(--ink); border-radius: 20px; background: var(--chili); color: #fff; font: 800 26px/1 var(--f2);
    box-shadow: 0 6px 0 var(--ink); cursor: pointer; transition: transform .06s, box-shadow .06s; }
  .rp-go:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .rp-go[disabled] { opacity: .45; }
  .rp-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rp-row .btn { flex: 1 1 120px; min-height: 48px; justify-content: center; }
  .seg-ctrl { width: 100%; }
  .rp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rp-chip { border: 2px solid var(--ink); border-radius: 99px; background: #fff; padding: 7px 12px; font: 800 13px/1 var(--f); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .rp-chip.on { background: var(--gold); }
  .rp-chip i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
  .rp-chip .x { font-weight: 800; color: var(--ink-3); }
  .rp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .rp-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; }
  .rp-list li.now { background: var(--leaf-soft); }
  .rp-list li.lock { opacity: .5; }
  .rp-list li > div { flex: 1; min-width: 0; }
  .rp-list b { display: block; font: 800 14.5px/1.2 var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rp-list small { display: block; font: 700 12px/1.2 var(--f); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rp-ib { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: var(--gold); display: grid; place-items: center; cursor: pointer; padding: 0; font: 900 15px/1 var(--f); }
  .rp-ib.on { background: var(--leaf); color: #fff; }
  .rp-ib.plain { background: none; border: 0; color: var(--ink-3); }
  .rp-ib .ic { width: 16px; height: 16px; }
  .rp-add { display: flex; gap: 8px; }
  .rp-add .input { flex: 1; }
  .rp-now { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--gold); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); }
  .rp-now b { display: block; font: 800 18px/1.2 var(--f2); }
  .rp-now small { display: block; font: 700 13px/1.3 var(--f); }
  .rp-now > div { flex: 1; min-width: 0; }
  .rp-ctl { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; margin-top: 10px; }
  .rp-ctl .btn { min-height: 56px; justify-content: center; font-size: 16px; }
  .rp-time { font: 800 64px/1 var(--f2); text-align: center; padding: 18px 0; font-variant-numeric: tabular-nums; background: #fff; border: 3px solid var(--ink); border-radius: 20px; }
  .rp-time.warn { color: var(--chili); }
  .rp-word { text-align: center; padding: 16px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; }
  .rp-word small { display: block; font: 800 12px/1 var(--f); color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
  .rp-word b { display: block; font: 800 28px/1.15 var(--f2); margin-top: 6px; }
  .rp-sb { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .rp-sb li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 6px; align-items: center; padding: 8px 10px; background: var(--c); border: 3px solid var(--ink); border-radius: 16px; }
  .rp-sb input { min-width: 0; width: 100%; border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.2); color: #fff; border-radius: 10px; padding: 8px; font: 800 16px/1 var(--f); }
  .rp-sb span { min-width: 48px; text-align: center; font: 800 30px/1 var(--f2); color: #fff; font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 rgba(0,0,0,.3); }
  .rp-sb button { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font: 800 26px/1 var(--f2); cursor: pointer; padding: 0; }
  .rp-sb .del { width: 28px; height: 28px; font-size: 13px; border-width: 2px; }
  .rp-note { font: 700 12.5px/1.4 var(--f); color: var(--ink-3); margin-top: 8px; }
  .rm-closed { text-align: center; padding: 40px 10px; }
  .rm-closed h2 { font: 800 24px/1.2 var(--f2); }
  .rm-avs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .rm-avs button { flex: none; border: 2.5px solid transparent; border-radius: 50%; background: none; padding: 1px; cursor: pointer; }
  .rm-avs button.on { border-color: var(--ink); background: var(--gold); }
  .rm-cam { width: 46px; height: 46px; display: grid; place-items: center; background: var(--turq-soft) !important; font-size: 22px; }
  .rm-cam.on { background: var(--gold) !important; }

  /* Floating widgets: what's on the TV · music */
  .rw { position: fixed; left: 10px; right: 10px; bottom: calc(var(--rs-h) + 10px); z-index: 12; display: flex; gap: 8px; max-width: 540px; margin: 0 auto; pointer-events: none; }
  .rw > * { pointer-events: auto; }
  .rw-tv { flex: none; display: flex; align-items: center; gap: 8px; max-width: 46%; background: var(--ink); color: #fff; border: 2px solid var(--ink); border-radius: 99px; padding: 7px 14px 7px 10px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); text-align: left; }
  .rw-tv .ic { width: 22px; height: 22px; flex: none; color: var(--gold); }
  .rw-tv b { display: block; font: 800 14px/1.1 var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw-tv small { display: block; font: 700 11px/1.1 var(--f); color: var(--gold); }
  .rw-tv span { min-width: 0; }
  .rw-mu { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--paper); border: 2px solid var(--ink); border-radius: 99px; padding: 5px 5px 5px 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18); text-align: left; }
  .rw-mu .ic { width: 18px; height: 18px; flex: none; }
  .rw-mu span { flex: 1; min-width: 0; font: 800 13px/1.15 var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw-pp { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: var(--leaf); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .rw-pp .ic { width: 16px; height: 16px; }

  /* Sound strip: 2 x 4 pads, swipe for more */
  .rs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--ink); padding: 9px 9px calc(7px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; }
  .rs-pages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; max-width: 560px; margin: 0 auto; }
  .rs-pages::-webkit-scrollbar { display: none; }
  .rs-page { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
  .rs-pad { height: 52px; border: 0; border-radius: 12px; font: 800 13px/1.1 var(--f); padding: 4px; cursor: pointer; box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); overflow: hidden; word-break: break-word; -webkit-tap-highlight-color: transparent; }
  .rs-pad:active { box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); transform: translateY(2px); }
  .rs-dots { display: flex; justify-content: center; gap: 6px; margin-top: 7px; min-height: 7px; }
  .rs-dots i { width: 7px; height: 7px; border-radius: 50%; background: #7A7067; }
  .rs-dots i.on { background: var(--gold); }
  .rs-empty { color: #CFC6BB; font: 700 13px/1.4 var(--f); text-align: center; padding: 14px 6px; }

  /* Sheets (TV switcher, music) */
  .rsh { position: fixed; inset: 0; z-index: 20; background: rgba(30,26,22,.5); display: flex; align-items: flex-end; }
  .rsh[hidden] { display: none; }
  .rsh-in { width: 100%; max-width: 560px; margin: 0 auto; max-height: 86vh; overflow-y: auto; background: var(--paper); border-top: 3px solid var(--ink); border-radius: 24px 24px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom)); }
  .rsh-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .rsh-h h3 { font: 800 21px/1.1 var(--f2); }
  .tv-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tv-opts button { min-height: 54px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; font: 800 15px/1.1 var(--f); cursor: pointer; }
  .tv-opts button.on { background: var(--gold); box-shadow: 3px 3px 0 var(--ink); }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" integrity="sha384-yuGdyIzzYtOBlBG6JOWn+Ey9kpq7HocusNuxEGyyohr1eEyXpeEyehIIXC/hznw4" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" integrity="sha384-nwX2Qpkhc2sv6L0ZPkLefLGguao67toSowvePuQvGF6cG+8MUphGI2uI94Ls3JF7" crossorigin="anonymous"></script>

<script>
/* Bida-Vibe host remote: control the TV laptop/tablet from a phone.
   Home = big category pads. Each game page puts that game on the TV and has its settings + a big trigger.
   Floating: what's on the TV (tap to switch) and the music player. Bottom: the sound pads, always there.
   Reads the snapshot the TV app keeps in vk_remotes/{id} and sends small commands back.
   The TV app checks every command before running it. */
(function () {
  'use strict';
  const FIREBASE = { apiKey: 'AIzaSyCkgq_rS5ZlTO40PsoKhvG0ZwwefhjNeWE', authDomain: 'bidavibe.firebaseapp.com', projectId: 'bidavibe',
    storageBucket: 'bidavibe.firebasestorage.app', messagingSenderId: '596965053196', appId: '1:596965053196:web:cb32617798b800f4276f29' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const PAD_BG = { magenta: ['#E2367A', '#fff'], gold: ['#F6B21B', '#1E1A16'], turq: ['#0FA3A3', '#fff'], chili: ['#E4452B', '#fff'], leaf: ['#3E9B4F', '#fff'], paper: ['#FFFDF8', '#1E1A16'] };

  // Category pads on the home page: [id, label, colour, dark text?]
  const CATS = [['plan', 'Plan', '#0FA3A3'], ['videoke', 'Videoke', '#E2367A'], ['music', 'Music', '#3E9B4F'], ['card', 'Card', '#F6B21B', 1],
    ['score', 'Score', '#E4452B'], ['raffle', 'Raffle', '#7B4FBF'], ['dice', 'Dice', '#1F6FD1'], ['color', 'Color', '#D4537E'],
    ['henyo', 'Henyo', '#C8553D'], ['timer', 'Timer', '#1D9E75']];
  const GAMES = ['score', 'raffle', 'dice', 'color', 'henyo', 'timer'];          // opening one of these puts it on the TV
  const SCREENS = { videoke: 'Videoke', stage: 'Kanta (stage)', card: 'Card', games: 'Games', score: 'Score', raffle: 'Raffle', dice: 'Dice', color: 'Color', henyo: 'Henyo', plan: 'Plan', music: 'Music', sounds: 'Sounds' };

  const key = new URLSearchParams(location.search).get('k') || '';
  const S = { st: null, page: store.get('bv_rm_page', 'home'), sheet: '', lib: [], mlib: [], q: '', mq: '', mcat: '', who: store.get('bv_rm_who', { name: '', av: '', ph: '' }),
    last: '', lastAt: 0, pending: false, padsKey: '', recvAt: 0 };
  if (!vkPhotoOk(S.who.ph)) S.who.ph = '';
  if (!vkMouthOk(S.who.mo)) S.who.mo = '';
  if (!CATS.some(c => c[0] === S.page)) S.page = 'home';

  function closed(msg) {
    ['#rw', '#rs', '#rh'].forEach(s => $(s).hidden = true); $('#rsh').hidden = true;
    $('#rm').innerHTML = `<div class="card rm-closed">${vkAvatar('dj', 90)}<h2>${esc(msg)}</h2><p class="muted" style="margin-top:8px">Gawa ng bagong remote link sa app na naka-connect sa TV.</p></div>`;
  }
  if (!/^[A-Za-z0-9]{24}$/.test(key)) { closed('Mali ang remote link'); return; }

  let db;
  try { firebase.initializeApp(FIREBASE); db = firebase.firestore(); } catch (e) { closed('Hindi ma-load ang remote'); return; }

  // Send one command to the TV. The exact same command twice within 250 ms is a double tap: ignore it.
  async function send(k, v = '', n = -1, s = '', av = '', ph = '', mo = '') {
    const sig = [k, v, n, s].join('|'), now = Date.now();
    if (sig === S.last && now - S.lastAt < 250) return; S.last = sig; S.lastAt = now;
    try { await db.collection('vk_remotes').doc(key).collection('cmds').add({ k, v: String(v).slice(0, 40), n: Number.isInteger(n) ? n : -1, s: String(s).slice(0, 24), av, ...(vkPhotoOk(ph) ? { ph, ...(vkMouthOk(mo) ? { mo } : {}) } : {}), at: firebase.firestore.FieldValue.serverTimestamp() }); }
    catch (e) {
      toast(e && e.code === 'permission-denied' && S.st && k === 'show'
        ? 'Hindi pa updated ang Firestore rules. I-publish ulit ang firestore.rules sa Firebase.'
        : 'Hindi na-send. Baka sarado na ang remote.');
    }
  }
  const tv = () => (S.st && S.st.tv) || {};
  const onTV = id => tv().view === 'tv' && tv().screen === id;

  window.RM = {
    go(p) {
      if (p === 'card') { send('show', 'card'); buzz(12); toast('Card · nasa TV na'); return; }
      S.page = p; store.set('bv_rm_page', p);
      if (GAMES.includes(p)) send('show', p);                    // the game shows up on the TV
      window.scrollTo(0, 0); render(true);
    },
    sheet(name) { S.sheet = name; renderSheet(); },
    tv(v) { send('show', v); buzz(12); S.sheet = ''; renderSheet(); },
    pad(id) { send('pad', id); buzz(15); },
    stop() { send('stop'); buzz(15); },
    music(v) { send('music', v); buzz(10); },
    play(i) { send('music', 'play', i); buzz(10); },
    playf(i) { send('music', 'playf', i); buzz(10); },
    plcat(c) { send('music', 'plcat', -1, c); },
    plplay() { send('music', 'plplay'); buzz(10); },
    madd(c) {
      const m = S.st.music || {}, s = S.mlib.find(x => x.c === c); if (!s) return;
      const have = (m.list || []).some(l => l.y === s.y);
      if (!have && m.full) { toast('Hanggang 5 songs lang sa free. I-unlock ang Premium sa app sa TV para sa lahat.'); return; }

    const page = { home: homeHTML, plan: planHTML, videoke: vkHTML, music: musicHTML, score: scoreHTML, raffle: raffleHTML, dice: diceHTML, color: colorHTML, henyo: henyoHTML, timer: timerHTML }[S.page] || homeHTML;

        <button class="btn ${m.faded ? 'btn--magenta' : 'btn--ghost'}" onclick="RM.music('fade')">${m.faded ? 'Fade in' : 'Fade out'}</button></div>` : ''}`;

  function mlibCatsHTML() {

  /* Game pages */
  function scoreHTML(st) {

      <ul class="rp-sb" style="margin-top:12px">${(sb.teams || []).map((t, i) => `<li style="--c:${/^#[0-9A-Fa-f]{6}$/.test(t.c) ? t.c : '#1E1A16'}">

        ${sb.mode === 'custom' && sb.teams.length > 2 ? `<button class="del" onclick="RM.tool('sb-delteam', ${i})" aria-label="Alisin">✕</button>` : ''}</li>`).join('')}</ul>
      ${sb.mode === 'custom' && sb.teams.length < 8 ? `<button class="btn btn--ghost btn--sm" style="margin-top:10px" onclick="RM.tool('sb-addteam')">${ic('plus')}Add team</button>` : ''}
      <div class="rp-row" style="margin-top:12px">${sb.on ? `<button class="btn btn--ghost" onclick="RM.score('hide')">Hide sa TV</button>` : `<button class="btn btn--chili" onclick="RM.score('show')">Show sa TV</button>`}
        <button class="btn btn--ghost" onclick="RM.score('reset')">Reset</button></div>

  function raffleHTML(st) {

    return head('Raffle', 'raffle') + `<div class="seg-ctrl seg-ctrl--light" role="group">
        <button class="${t.rmode !== 'shuffle' ? 'on' : ''}" onclick="RM.tool('rf-mode',-1,'wheel')">Roleta</button>
        <button class="${t.rmode === 'shuffle' ? 'on' : ''}" onclick="RM.tool('rf-mode',-1,'shuffle')">Name shuffle</button></div>
      <div class="rp-sec"><span class="rp-lbl">Mga kasali (${names.length})</span>
        <div class="rp-add"><input class="input" id="rf-new" maxlength="24" placeholder="Type ang name" autocomplete="off" onkeydown="if(event.key==='Enter')RM.rfAdd()"><button class="btn btn--ink" onclick="RM.rfAdd()">${ic('plus')}Add</button></div>
        ${names.length ? `<div class="rp-chips" style="margin-top:10px">${names.map((n, i) => `<button class="rp-chip" onclick="RM.tool('rf-del', ${i})" aria-label="Tanggalin si ${esc(n)}">${esc(n)} <span class="x">✕</span></button>`).join('')}</div>` : '<p class="rp-note">Kailangan ng at least 2 names.</p>'}
        <label class="toggle" style="margin-top:12px"><input type="checkbox" ${t.remove ? 'checked' : ''} onchange="RM.tool('rf-remove', this.checked ? 1 : 0)">Tanggalin sa list ang nanalo</label>
        ${names.length ? `<button class="btn btn--ghost btn--sm" style="margin-top:8px" onclick="if(confirm('Burahin lahat ng names?'))RM.tool('rf-clear')">Clear lahat</button>` : ''}</div>
      <button class="rp-go" onclick="RM.tool('raffle-go')" ${names.length < 2 ? 'disabled' : ''}>${t.rmode === 'shuffle' ? 'Bunot na!' : 'I-spin!'}</button>`;
  }
  function diceHTML(st) {

        <button class="${d.kind === 'num' ? 'on' : ''}" onclick="RM.tool('dice-kind',-1,'num')">Numbered</button>

      <div class="rp-sec"><span class="rp-lbl">Ilang dice</span><div class="seg-ctrl seg-ctrl--light" role="group">${[1, 2, 3, 4, 5, 6].map(k => `<button class="${d.n === k ? 'on' : ''}" onclick="RM.tool('dice-n', ${k})">${k}</button>`).join('')}</div></div>

  }
  function colorHTML(st) {

      <button class="rp-go" style="background:#D4537E" onclick="RM.tool('color-go')">Random color</button>`;

  function henyoHTML(st) {

        <div class="rp-row" style="margin-top:8px"><button class="btn btn--ghost" onclick="RM.tool('hy-hide')">${w.hid ? 'Ipakita sa TV' : 'Itago sa TV'}</button>
        <button class="btn btn--ghost" onclick="RM.tool('hy-timer')">Start timer · ${fmt(t.hsec || 120)}</button></div>` : '<p class="rp-note">Pindutin ang Bunot para lumabas ang word.</p>'}
      <div class="rp-sec"><span class="rp-lbl">Categories</span><div class="rp-chips">${cats.map(([k, l]) => `<button class="rp-chip ${on.includes(k) ? 'on' : ''}" onclick="RM.tool('hy-cat',-1,'${esc(k)}')">${esc(l)}</button>`).join('')}</div></div>
      <div class="rp-sec"><span class="rp-lbl">Oras bawat round</span><div class="seg-ctrl seg-ctrl--light" role="group">${[[60, '1 min'], [120, '2 min'], [180, '3 min']].map(([s, l]) => `<button class="${t.hsec === s ? 'on' : ''}" onclick="RM.tool('hy-sec', ${s})">${l}</button>`).join('')}</div></div>

      <div class="rp-row" style="margin-top:10px">${v.stage

        <button class="rp-ib plain" onclick="RM.del(${i})" aria-label="Alisin">${ic('x')}</button></li>`).join('')}</ol>` : '<p class="muted">Wala pang nakapila.</p>'}</div>
    <div class="rp-sec card"><span class="rp-lbl">Reserve</span>
      <input class="input" placeholder="Sino ang kakanta?" maxlength="24" value="${esc(S.who.name)}" oninput="RM.name(this.value)" autocomplete="off">
      <div class="rm-avs"><button class="rm-cam ${S.who.ph ? 'on' : ''}" onclick="RM.cam()" aria-label="Selfie">${S.who.ph ? vkFace(S.who, 40) : '<span>📷</span>'}</button>${VK_AVATARS.map(a => `<button class="${!S.who.ph && S.who.av === a.id ? 'on' : ''}" onclick="RM.av('${a.id}')" aria-label="${esc(a.name)}">${a.svg(40)}</button>`).join('')}</div>
      <input class="input" style="margin-top:6px" placeholder="Search song o artist" value="${esc(S.q)}" oninput="RM.find(this.value)" autocomplete="off">
      <ul class="rp-list" id="rm-songs" style="margin-top:8px"></ul></div>`;

  function songs() {
    const box = $('#rm-songs'); if (!box) return;
    if (!S.lib.length) { box.innerHTML = '<li class="muted" style="border:0;background:none">Loading ang library…</li>'; return; }
    const vk = (S.st && S.st.vk) || {}, fr = Array.isArray(vk.free) ? new Set(vk.free) : null, ok = c => !fr || fr.has(c);
    const q = norm(S.q), res = (q ? S.lib.filter(s => norm(s.t).includes(q) || norm(s.a).includes(q)) : S.lib).filter(s => ok(s.c)).slice(0, 40);

  /* Sound strip: pages of 7 pads + Stop; only redrawn when the pads change, so swiping isn't reset */
  function renderPads() {
    const pads = S.st.pads || [], k = JSON.stringify(pads);
    $('#rs').hidden = false;
    if (k === S.padsKey) return; S.padsKey = k;
    const box = $('#rs-pages');
    if (!pads.length) { box.innerHTML = '<div class="rs-page" style="display:block"><p class="rs-empty">Wala pang sound pads sa app.</p></div>'; $('#rs-dots').innerHTML = ''; return; }
    const pages = []; for (let i = 0; i < pads.length; i += 7) pages.push(pads.slice(i, i + 7));
    box.innerHTML = pages.map(pg => `<div class="rs-page">${pg.map(p => { const [bg, fg] = PAD_BG[p.c] || PAD_BG.paper; return `<button class="rs-pad" style="background:${bg};color:${fg}" data-id="${esc(p.id)}" onclick="RM.pad(this.dataset.id)">${esc(p.n)}</button>`; }).join('')}

      const cur = t.view === 'tv' ? t.screen : '';
      const opts = ['videoke', 'stage', 'card', 'games', 'score', 'raffle', 'dice', 'color', 'henyo'];
      $('#rsh-in').innerHTML = `<div class="rsh-h"><h3>Ipakita sa TV</h3><button class="rp-back" onclick="RM.sheet('')" aria-label="Close">${ic('x')}</button></div>
        <div class="tv-opts">${opts.map(id => `<button class="${cur === id ? 'on' : ''}" onclick="RM.tv('${id}')">${SCREENS[id]}</button>`).join('')}
          <button onclick="RM.tv('timer')">Timer</button></div>
        <div class="rp-row" style="margin-top:12px">${t.view === 'tv' ? `<button class="btn btn--ink" onclick="RM.tv('host')">Host view</button>` : ''}
          <button class="btn btn--ghost" onclick="RM.tv('close')">Close sa TV</button></div>
        <p class="rp-note">Sa TV view, games at videoke lang ang nakikita ng mga bisita.</p>`;
    } else {
      $('#rsh-in').innerHTML = `<div class="rsh-h"><h3>Music</h3><button class="rp-back" onclick="RM.sheet('')" aria-label="Close">${ic('x')}</button></div>
        ${nowHTML(m)}<div class="rp-sec">${playlistHTML(m)}</div>
        <button class="btn btn--ghost btn--block" style="margin-top:12px" onclick="RM.sheet('');RM.go('music')">${ic('plus')}Add songs</button>`;
    }
    box.hidden = false;
  }
  // The timer counts down on the phone too, between updates from the TV
  function tick() {
    const el = $('#rm-tm'), tm = S.st && S.st.timer; if (!el || !tm) return;
    const left = tm.run ? tm.left - (Date.now() - S.recvAt) / 1000 : tm.left;
    el.textContent = fmt(left); el.classList.toggle('warn', tm.run && left <= 10);
  }
  setInterval(tick, 250);

  /* Libraries (read straight from the site) */
  fetch('karaoke/library.json?t=' + Math.floor(Date.now() / 6e5), { cache: 'no-cache' }).then(r => r.ok ? r.json() : { songs: [] })
    .then(j => { S.lib = (j.songs || []).filter(s => s && s.c >= 1 && /^[\w-]{11}$/.test(s.y)).map(s => ({ c: +s.c, t: String(s.t || 'Kanta').slice(0, 80), a: String(s.a || '').slice(0, 60) }))
      .sort((a, b) => norm(a.t) < norm(b.t) ? -1 : 1); songs(); }).catch(() => { });
  fetch('music/library.json?t=' + Math.floor(Date.now() / 6e5), { cache: 'no-cache' }).then(r => r.ok ? r.json() : { songs: [] })
    .then(j => { S.mlib = (j.songs || []).filter(s => s && s.c >= 1 && /^[\w-]{11}$/.test(s.y)).map(s => ({ c: +s.c, y: s.y, t: String(s.t || 'Song').slice(0, 80), a: String(s.a || '').slice(0, 60), g: String(s.g || '').slice(0, 20) }))
      .sort((a, b) => norm(a.t) < norm(b.t) ? -1 : 1); const b = $('#ml-res'); if (b) { b.innerHTML = mlibHTML(); $('#ml-cats').innerHTML = mlibCatsHTML(); } }).catch(() => { });

  db.collection('vk_remotes').doc(key).onSnapshot(d => {
    if (!d.exists) { closed('Walang ganitong remote'); return; }
    const data = d.data();
    if (!data.open || !(data.expires && data.expires.toMillis() > Date.now())) { closed('Closed na ang remote'); return; }
    S.st = data.state || {}; S.recvAt = Date.now();
    render();
  }, () => closed('Ayaw bumukas ng remote. Baka closed na.'));
})();
</script>
</body>
</html>
