<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E2367A">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<!-- Anti-clickjacking: if another site loads this page inside a frame, show nothing -->
<style id="antiframe">html{display:none}</style>
<script>if (window.top === window.self) { document.getElementById('antiframe').remove(); } else { try { window.top.location = window.self.location; } catch (e) {} }</script>
<title>Videoke · Pili ng kanta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 8h56l-6 24-22 24L10 32z' fill='%23E2367A' stroke='%231E1A16' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='24' r='7' fill='%23FFF6E5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bida.css?v=20261114e">
<style>
  body { background: var(--cream); min-height: 100vh; }
  .sg { max-width: 560px; margin: 0 auto; padding: 18px 16px 60px; }
  .sg-hero { background: var(--magenta); color: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 18px 18px 20px; box-shadow: 6px 6px 0 var(--ink); }
  .sg-hero small { font: 800 12px/1 var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .sg-hero h1 { font: 800 clamp(26px, 7vw, 36px)/1.1 var(--f2); margin: 6px 0 0; }
  .sg-card { margin-top: 16px; }
  .sg-avs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .sg-avs button { background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 4px; font: 800 12px/1 var(--f); color: var(--ink); cursor: pointer; }
  .sg-avs button.on { background: var(--gold); box-shadow: 3px 3px 0 var(--ink); transform: translate(-2px, -2px); }
  .sg-avs svg, .sg-avs .vk-ph { width: 100%; max-width: 64px; height: auto; }
  .sg-cam { background: var(--turq-soft) !important; } .sg-cam.on { background: var(--gold) !important; }
  .sg-cam-ic { font-size: 34px; line-height: 64px; height: 64px; display: block; }
  .sg-me { display: flex; align-items: center; gap: 12px; }
  .sg-me b { font: 800 20px/1.1 var(--f2); display: block; }
  .sg-q { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .sg-q li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; }
  .sg-q li.now { background: var(--gold); }
  .sg-q li > div { min-width: 0; flex: 1; }
  .sg-q b { display: block; font: 800 15px/1.2 var(--f); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sg-q small { display: block; font: 700 12.5px/1.2 var(--f); color: var(--ink-3); }
  .sg-closed { text-align: center; padding: 40px 10px; }
  .sg-closed h2 { font: 800 26px/1.2 var(--f2); }
  .sg-foot { text-align: center; margin-top: 26px; font: 700 12.5px/1.4 var(--f); color: var(--ink-3); }
</style>
</head>
<body>
<main class="sg" id="sg"><p class="muted" style="padding:40px 0;text-align:center">Kinukuha ang videoke…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Pinned versions with SRI: the browser refuses these files if they were ever altered -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" integrity="sha384-yuGdyIzzYtOBlBG6JOWn+Ey9kpq7HocusNuxEGyyohr1eEyXpeEyehIIXC/hznw4" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" integrity="sha384-nwX2Qpkhc2sv6L0ZPkLefLGguao67toSowvePuQvGF6cG+8MUphGI2uI94Ls3JF7" crossorigin="anonymous"></script>
<script src="vk-avatars.js?v=20261114e"></script>
<script>
/* Bida-Vibe guest page: a family member opens the host's link, types a name, picks an avatar
   and adds songs. They can't see or change anything else in the host's app — the Firestore rules
   only let them ADD a well-formed song request to that one open room. */
(function () {
  'use strict';
  const FIREBASE = { apiKey: 'AIzaSyCkgq_rS5ZlTO40PsoKhvG0ZwwefhjNeWE', authDomain: 'bidavibe.firebaseapp.com', projectId: 'bidavibe',
    storageBucket: 'bidavibe.firebasestorage.app', messagingSenderId: '596965053196', appId: '1:596965053196:web:cb32617798b800f4276f29' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); };
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };

  const room = new URLSearchParams(location.search).get('r') || '';
  const S = { room: null, lib: [], q: '', me: store.get('bidavibe_guest', null), editing: false, lastAdd: 0, sent: store.get('bidavibe_guest_sent_' + room, 0) };
  const MAX_PER_GUEST = 8, COOLDOWN = 10000;
  if (S.me && !(typeof S.me.name === 'string' && S.me.name.trim() && VK_AVATARS.some(a => a.id === S.me.av))) S.me = null;
  if (S.me && !vkPhotoOk(S.me.ph)) S.me.ph = '';

  function closed(msg) {
    $('#sg').innerHTML = `<div class="card sg-closed">${vkAvatar('dj', 96)}<h2>${esc(msg)}</h2>
      <p class="muted" style="margin-top:8px">Hingi ka ng bagong link sa host.</p></div>`;
  }
  if (!/^[A-Za-z0-9]{24}$/.test(room)) { closed('Mali ang link na ito'); return; }

  function render() {
    const r = S.room;
    if (!r) return;
    if (!r.open || !(r.expires && r.expires.toMillis() > Date.now())) { closed('Sarado na ang videoke link'); return; }
    const who = !S.me || S.editing;
    $('#sg').innerHTML = `
      <div class="sg-hero"><small>Videoke · Pili ng kanta</small><h1>${esc(r.title || 'Videoke')}</h1></div>
      ${who ? profileHTML() : `
        <div class="card sg-card sg-me">${vkFace(S.me, 56)}<div style="flex:1"><small class="muted">Kakanta</small><b>${esc(S.me.name)}</b></div>
          <button class="btn btn--ghost btn--sm" id="sg-edit">Palitan</button></div>
        <div class="card sg-card"><h3>Pili ng kanta</h3>
          <input class="input" id="sg-q" style="margin-top:10px" placeholder="Hanapin: kanta, artist o code" value="${esc(S.q)}" autocomplete="off">
          <div id="sg-res"></div></div>`}
      <div class="card sg-card"><h3>Pila <small class="muted">(${(r.queue || []).length})</small></h3>${queueHTML(r)}</div>
      <p class="sg-foot">Bida-Vibe Videoke · Ang host lang ang may hawak ng screen at pila.</p>`;
    if (who) bindProfile(); else {
      $('#sg-edit').onclick = () => { S.editing = true; render(); };
      $('#sg-q').oninput = e => { S.q = e.target.value; results(); };
      results();
    }
  }
  function profileHTML() {
    const me = S.me || { name: '', av: '' };
    return `<div class="card sg-card"><h3>Sino ka?</h3>
      <div class="field" style="margin-top:10px"><label for="sg-name">Pangalan mo</label>
        <input class="input" id="sg-name" maxlength="24" placeholder="hal. Tita Baby" value="${esc(me.name)}" autocomplete="nickname"></div>
      <p style="margin-top:12px;font-weight:800">Selfie o avatar</p>
      <div class="sg-avs" role="radiogroup" aria-label="Avatar"><button type="button" class="sg-cam ${me.ph ? 'on' : ''}" id="sg-cam" aria-label="Kunan ng selfie">${me.ph ? vkFace(me, 64) : '<span class="sg-cam-ic">📷</span>'}${me.ph ? 'Ulitin' : 'Selfie'}</button>${VK_AVATARS.map(a => `<button type="button" role="radio" aria-checked="${!me.ph && a.id === me.av}" data-av="${a.id}" class="${!me.ph && a.id === me.av ? 'on' : ''}">${a.svg(64)}${esc(a.name)}</button>`).join('')}</div>
      <button class="btn btn--chili btn--block" id="sg-go" style="margin-top:14px">Tara, pili na ng kanta</button></div>`;
  }
  function bindProfile() {
    let av = S.me ? S.me.av : '', ph = S.me && S.me.ph || '';
    document.querySelectorAll('.sg-avs button').forEach(b => b.onclick = () => {
      if (!b.dataset.av) return;
      av = b.dataset.av; ph = '';                           // picking a cartoon avatar replaces the selfie
      document.querySelectorAll('.sg-avs button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
      const cam = $('#sg-cam'); cam.innerHTML = '<span class="sg-cam-ic">📷</span>Selfie';
    });
    // Selfie: camera only, no photo upload
    $('#sg-cam').onclick = () => vkCamera(p => {
      ph = p; const cam = $('#sg-cam');
      document.querySelectorAll('.sg-avs button').forEach(x => { x.classList.toggle('on', x === cam); x.setAttribute('aria-checked', x === cam); });
      cam.innerHTML = vkFace({ ph }, 64) + 'Ulitin';
    });
    $('#sg-go').onclick = () => {
      const name = $('#sg-name').value.replace(/\s+/g, ' ').trim().slice(0, 24);
      if (!name) { toast('I-type muna ang pangalan mo'); $('#sg-name').focus(); return; }
      if (!av && !ph) { toast('Mag-selfie o pumili ng avatar'); return; }
      S.me = { name, av: av || vkAvatarFor(name), ph }; S.editing = false; store.set('bidavibe_guest', S.me); render();
    };
  }
  function queueHTML(r) {
    const list = [];
    if (r.now) list.push([r.now, true]);
    (r.queue || []).forEach(it => list.push([it, false]));
    if (!list.length) return '<p class="muted" style="margin-top:8px">Wala pang nakapila. Ikaw na mauna!</p>';
    return `<ol class="sg-q">${list.slice(0, 40).map(([it, now], i) => `<li class="${now ? 'now' : ''}">${vkFace({ av: String(it.av || ''), ph: it.ph }, 38)}
      <div><b>${esc(it.t)}</b><small>${now ? 'Kumakanta: ' : (r.now ? i : i + 1) + '. '}${esc(it.n)}</small></div></li>`).join('')}</ol>`;
  }
  function results() {
    const box = $('#sg-res'); if (!box) return;
    if (!S.lib.length) { box.innerHTML = '<p class="muted" style="margin-top:12px">Wala pang kanta sa library.</p>'; return; }
    const q = norm(S.q);
    const res = (q ? S.lib.filter(s => String(s.c).startsWith(q) || norm(s.t).includes(q) || norm(s.a).includes(q)) : S.lib).slice(0, 50);
    box.innerHTML = res.length ? `<ul class="vk-list">${res.map(s => `<li><span class="vk-c">${s.c}</span><div><b>${esc(s.t)}</b><small>${esc(s.a)}</small></div>
      <button class="btn btn--gold btn--sm" data-c="${s.c}">Kanta ko!</button></li>`).join('')}</ul>` : '<p class="muted" style="margin-top:12px">Walang nahanap.</p>';
    box.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => add(+b.dataset.c, b));
  }
  async function add(c, btn) {
    const s = S.lib.find(x => x.c === c); if (!s || !S.me) return;
    if (S.sent >= MAX_PER_GUEST) { toast('Naka-' + MAX_PER_GUEST + ' kanta ka na. Bigyan mo naman ng chance ang iba!'); return; }
    if (Date.now() - S.lastAdd < COOLDOWN) { toast('Teka lang, isa-isa muna.'); return; }
    S.lastAdd = Date.now(); btn.disabled = true;
    try {
      await db.collection('vk_rooms').doc(room).collection('requests').add({
        name: S.me.name, av: S.me.av, c: s.c, t: s.t, a: s.a, y: s.y, ...(vkPhotoOk(S.me.ph) ? { ph: S.me.ph } : {}), at: firebase.firestore.FieldValue.serverTimestamp() });
      S.sent++; store.set('bidavibe_guest_sent_' + room, S.sent);
      toast(`Sent na: ${s.t}! Lalabas sa pila in a few seconds.`);
    } catch (e) { S.lastAdd = 0; toast('Hindi na-send. Baka sarado na ang link, try ulit.'); }
    btn.disabled = false;
  }
  function cleanSong(s) {
    const c = parseInt(s && s.c, 10), y = String(s && s.y || '');
    if (!(c >= 1 && c <= 99999) || !/^[\w-]{11}$/.test(y)) return null;
    return { c, y, t: String(s.t || 'Kanta').slice(0, 80), a: String(s.a || '').slice(0, 60) };
  }

  let db;
  try { firebase.initializeApp(FIREBASE); db = firebase.firestore(); } catch (e) { closed('Hindi ma-load ang videoke'); return; }
  fetch('karaoke/library.json?t=' + Math.floor(Date.now() / 6e5), { cache: 'no-cache' }).then(r => r.ok ? r.json() : { songs: [] })
    .then(j => { S.lib = (j.songs || []).map(cleanSong).filter(Boolean).sort((a, b) => a.c - b.c); results(); }).catch(() => { });
  db.collection('vk_rooms').doc(room).onSnapshot(d => {
    if (!d.exists) { closed('Walang ganitong videoke link'); return; }
    const first = !S.room; S.room = d.data();
    // Re-render the queue only, so typing in the search box isn't interrupted
    if (!first && $('#sg-q') && S.room.open) { const cards = document.querySelectorAll('.sg-card'); const qc = cards[cards.length - 1]; if (qc) { qc.innerHTML = `<h3>Pila <small class="muted">(${(S.room.queue || []).length})</small></h3>${queueHTML(S.room)}`; return; } }
    render();
  }, () => closed('Hindi mabuksan ang link, baka sarado na'));
})();
</script>
</body>
</html>
